{% extends 'base.html' %}
{% block body %}
<div class="container mt-5" style="max-width: 450px;">
    <h2 class="text-center fw-bold text-decoration-underline mb-4">Register as Citizen</h2>

    <form action="/signup" method="POST">

        <div class="mb-3">
            <label class="fw-bold">Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold">Email</label>
            <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold">Password</label>
            <input type="password" class="form-control" name="password" minlength="8" placeholder="At least 8 characters" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold">Residential Pincode</label>
            <input type="text" class="form-control" name="pincode" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" placeholder="6-digit residential pincode" required>
            <div class="form-text">Used to automatically route your civic complaints to your local area.</div>
        </div>

        <div class="mt-4">
            <button type="submit"
                class="btn w-100 fw-bold text-white"
                style="background-color: orange;">
                REGISTER
            </button>
        </div>

        <div class="text-center mt-3">
            Already have an account? <a href="/login" class="fw-bold text-decoration-none">Login here</a>
        </div>

    </form>
</div>
{% endblock body %}
