{% extends 'worker_base.html' %}

{% block body %}

<div class="container py-5" style="max-width: 500px;">

    <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">

            <h2 class="text-center mb-2 fw-bold">
                Field Worker Login
            </h2>

            <p class="text-center text-muted mb-4">
                Login to access assigned field tasks and upload repair proof
            </p>

            <form method="POST" action="/worker_login">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Worker Email</label>
                    <input
                        type="email"
                        name="worker_email"
                        class="form-control"
                        placeholder="Enter your registered email"
                        value="{{ email or '' }}"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input
                        type="password"
                        name="worker_password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit"
                        class="btn btn-warning w-100 py-2 fw-semibold text-dark">
                    Login to Worker Portal
                </button>

            </form>

            <p class="text-center mt-4 mb-0 text-muted">
                New field worker?
                <a href="/worker_signup" class="text-decoration-none fw-semibold">Register here</a>
            </p>

            <div class="text-center mt-3">
                <a href="/login" class="text-secondary small me-2">Citizen Portal</a> |
                <a href="/gov_login" class="text-secondary small ms-2">Official Portal</a>
            </div>

        </div>
    </div>

</div>

{% endblock body %}
