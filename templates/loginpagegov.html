{% extends 'gov_base.html' %}

{% block body %}

<div class="container py-5" style="max-width: 500px;">

    <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">

            <h2 class="text-center mb-2 fw-bold">
                Government Employee Login
            </h2>

            <p class="text-center text-muted mb-4">
                Login to the NIVARAN Official Portal
            </p>

            <form method="POST" action="/gov_login">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Official Email</label>
                    <input
                        type="email"
                        name="emp_email"
                        class="form-control"
                        placeholder="Enter your official email"
                        value="{{ email or '' }}"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input
                        type="password"
                        name="emp_password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 py-2 fw-semibold">
                    Login
                </button>

            </form>

            <p class="text-center mt-4 mb-0 text-muted">
                Don't have an official account?
                <a href="/gov_signup" class="text-decoration-none fw-semibold">Register here</a>
            </p>

            <div class="text-center mt-3">
                <a href="/login" class="text-secondary small">Looking for Citizen Portal? Click here</a>
            </div>

        </div>
    </div>

</div>

{% endblock body %}
